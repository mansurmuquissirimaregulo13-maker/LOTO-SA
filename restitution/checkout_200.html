<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paystack Checkout – Loto SA</title>
  <script src="https://js.paystack.co/v1/inline.js"></script>
  <style>
    body {font-family: Arial, Helvetica, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin:0; background:#f5f5f5;}
    button {background:#0066ff;color:#fff;border:none;padding:0.75rem 1.5rem;border-radius:4px;font-size:1rem;cursor:pointer;}
    button:hover {background:#004fbf;}
  </style>
</head>
<body>
  <button type="button" onclick="payWithPaystack()">Pagar R 200,00 com Paystack</button>
  <script>
    function payWithPaystack(){
      var handler = PaystackPop.setup({
        key: 'pk_test_XXXXXXXXXXXXXXXXXXXXXX', // TODO: replace with your Paystack public key
        email: 'cliente@example.com',
        amount: 20000, // amount in kobo (R200.00)
        currency: 'ZAR',
        ref: 'PS_' + new Date().getTime(),
        callback: function(response){
          alert('Pagamento aprovado. Referência: ' + response.reference);
        },
        onClose: function(){
          alert('Popup fechado sem pagamento.');
        }
      });
      handler.openIframe();
    }
  </script>
</body>
</html>
